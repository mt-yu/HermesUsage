name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 为什么 fetch-depth: 0 —— `scripts/check.py` 的第 4 项（变更日志同步）要用
          # `git tag -l` 现算 CHANGELOG；浅克隆里没有 tag，会把它误判成「与 git 不一致」。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 全量检查（门禁 + 单元测试 + 站点自检）
        run: python scripts/check.py
