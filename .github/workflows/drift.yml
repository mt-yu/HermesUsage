name: drift

# 文档漂移哨兵 —— CI 版。
#
# 课程的判据是「读者装得到的那个 release」，所以哨兵只问一句：
# **上游有没有发比基线更新的 release？**（scripts/release_probe.py 的 watch 模式）
# 有 → 开一条 issue 提醒做复核；没有 → 安静。
#
# 为什么不再比「上游 main 的 docs」：main 永远领先于最新 release，那种比法每天都会报
# 几十页漂移，而 2026-09-20 逐页定版后「课程写错了」的是 0 条 —— 那是噪音不是信号。
# 结论与判据见 ROADMAP「官方文档漂移复核（2026-09-20 第二次）」。
#
# 基线写在 sources/registry.yaml 顶部的 `# baseline-release:`；复核完记得更新它。
# 有新 release → 开一条 issue（标题前缀去重，不会每天刷屏）；只有「检查本身跑不起来」
# 才让这次运行变红。每天 09:00（北京）跑一次。

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = 北京 09:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: 跑漂移哨兵（有新 release 就开 issue）
        id: sentinel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/drift_watch.py --source release
          code=$?
          set -e
          case "$code" in
            0) echo "::notice::无需行动 —— 本仓库基线仍是最新 release"; echo "new_release=0" >> "$GITHUB_OUTPUT" ;;
            1) echo "::warning::上游有新 release（issue 已新建或已存在同前缀 issue）"; echo "new_release=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::哨兵本身跑不起来（退出码 $code）：先看上面 release_probe 的输出"; exit "$code" ;;
          esac
          echo "哨兵退出码：$code（0=无需行动 1=该复核了）"

      # 只有真的发了新 release 才跑：19 条「上游已写、上个 release 还没有」里哪几条落地了
      - name: 有新 release → 列出哪几条待发布项已经落地
        if: steps.sentinel.outputs.new_release == '1'
        run: |
          set +e
          python scripts/pending_probe.py || true    # 不传 --tag：脚本自己取上游最新 release
          set -e
          echo "::notice::上面 ✅ 的条目就是该改课/恢复内容的清单（见 ROADMAP「待下一个 release 对照」）"
