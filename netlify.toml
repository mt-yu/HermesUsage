# Netlify：连上仓库就能自动构建（构建期装 Python 依赖 → 生成 site/ → 发布该目录）
[build]
  command = "python -m pip install -r requirements.txt && python scripts/build_site.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
