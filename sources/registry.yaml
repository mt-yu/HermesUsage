# 来源登记表 —— 教程里每一条事实的“可考证出处”
#
# 规则（见 .hermes.md）：
#   1. 课程正文里任何事实性陈述都必须带引用标记 [[src:<id>]]，且 <id> 必须在本表登记。
#   2. 本表的 key 尽量短、语义化、全项目唯一；新增时按模块就近插入。
#   3. 值 = 官方文档仓库 website/docs/ 下的相对路径（.md/.mdx）。
#   4. 实际的 URL / 版本 / 内容哈希由 scripts/sync_sources.py 从 docs 源码计算，
#      人工只维护“id → 文档路径”这一层映射，避免手工抄错。
#
# 校验：python scripts/sync_sources.py --check   （发现官方文档漂移）
#       python scripts/verify.py                 （发现课程里悬空的引用 id）

